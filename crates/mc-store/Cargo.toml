[package]
name = "mc-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "Magic Context durable cache-state store: per-session CoreState + module_meta with an app-level row_version CAS inside cortexkit-store's epoch-fenced transaction."

[lib]
name = "mc_store"
path = "src/lib.rs"

[dependencies]
cortexkit-cache-core = { workspace = true }
cortexkit-store = { workspace = true }
cortexkit-store-types = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
